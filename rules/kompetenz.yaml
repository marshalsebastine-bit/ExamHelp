meta:
  id: kompetenz
  family: B
  title: Familie B — Kompetenzzuordnung
  purpose: >
    Whether the item tests the competencies it claims to test, and whether those
    competencies are the ones the staatliche Pruefung is for.
  evidence_note: >
    Family B rules carry no static source.quote: their evidence is the competency text
    itself, looked up at runtime from rules/kompetenzen.yaml, which carries the Anlage
    locator and Fundstelle for each code. A flag citing I.1.h quotes I.1.h.
  data_dependencies:
    - rules/kompetenzen.yaml    # anlage_2_authoritative, parsed from PflAPrV Anlage 2
    - rules/pruefungsbereiche.yaml  # PflAPrV § 14 (1) Pruefungsbereich -> Kompetenzschwerpunkte
    - rules/situationsmerkmale.yaml # Lehrplan Situationsmerkmale per CE
  schema_migration_2026_09_11_revival: >
    teilaufgabe.kompetenzzuordnung (the author-declared Anlage-2 claim) was removed with
    no replacement earlier the same day, blocking every rule below. This revives four of
    the five: KOMP-01 is now the derivation step itself -- an LLM, behind a provider-agnostic
    gateway (gateway/model_gateway.py + gateway/base.py; Mistral AI is the default backend,
    swappable via MODEL_PROVIDER without touching this rule or its check), chooses among a
    deterministically-built candidate set
    (checks/llm/kompetenz_candidates.py, from the Teilaufgabe's curriculare Einheit) and
    writes the result onto the new teilaufgabe.kompetenzzuordnung_abgeleitet field. KOMP-03,
    KOMP-03B and KOMP-06 (checks/deterministic/komp_03.py, komp_06.py) are unchanged in
    logic, just re-pointed at that field. KOMP-02 cannot be revived the same way: its
    premise was comparing an author claim against a derived value, and there is no more
    claim to compare -- it is retired, not redesigned. Sequencing gap closed by
    checks/runner.py::run_checks: it runs KOMP-01 first, always, before the deterministic
    sweep that includes KOMP-03/03B/06, so kompetenzzuordnung_abgeleitet is populated (or
    visibly NotChecked, if no classify function was given) before anything reads it.

rules:

  - id: KOMP-01
    family: B
    title: Jede Teilaufgabe ist mindestens einer Anlage-2-Kompetenz zuordenbar
    rule_text: >
      Jede Teilaufgabe muss sich mindestens einer Einzelkompetenz der Anlage 2 PflAPrV
      zuordnen lassen. Eine Teilaufgabe, die keiner Kompetenz der Anlage 2 entspricht,
      prueft etwas, das nicht Gegenstand der staatlichen Pruefung ist.
    source:
      document: PflAPrV
      locator: Anlage 2 (zu § 9 Absatz 1 Satz 2)
      url: https://www.gesetze-im-internet.de/pflaprv/anlage_2.html
    authority: binding_federal
    jurisdiction: federal
    check_type: llm
    scope: teilaufgabe
    input_slice:
      - teilaufgabe.text
      - teilaufgabe.situationsmerkmale.curriculare_einheit
      - aufgabe.aufgaben[].fallsituation.text
    requires: ["teilaufgabe.text", "aufgabe.aufgaben[].fallsituation.text"]
    severity_default: pruefen
    mutation:
      id: MUT-KOMP-01
      operation: replace_with_off_catalogue_task
      description: >
        Replace a Teilaufgabe with one testing content outside the Anlage 2 catalogue
        entirely (e.g. abstract pharmacology arithmetic with no pflegerischer Handlungsbezug).
      target: teilaufgabe.text
    notes: >
      Now the derivation step itself (checks/llm/komp_01.py), not just a description of
      one: candidates come from checks/llm/kompetenz_candidates.py, which builds the set
      deterministically from teilaufgabe.situationsmerkmale.curriculare_einheit against
      rules/kompetenzen.yaml's per-CE kompetenzen_anlage_2 lists, before the LLM ever
      chooses among them (gateway/model_gateway.py, backend-agnostic). Three cases, not two: no CE
      declared falls back to the full 85-code Anlage-2 set (unknown, search broadly); a
      CE whose kompetenzen_anlage_2 list is genuinely empty (CE 01/02/03, the 1st/2nd
      Ausbildungsdrittel units with no staatliche-Pruefungs-relevant competency at all)
      stays empty rather than falling back -- that emptiness is itself the correct
      answer, and firing on it is the textually defensible outcome, not a false
      negative to route around. The chosen codes are written onto
      teilaufgabe.kompetenzzuordnung_abgeleitet for KOMP-03/03B/06 to read.
      The classifier prompt also carries the owning Aufgabe block's Fallsituation
      text as required context, not just the Teilaufgabe text in isolation: a
      Teilaufgabe often only makes sense read against its case scenario
      ("Erlaeutern Sie anhand der Fallsituation..."), and without it the model
      has to guess at details the Teilaufgabe never restates -- a guess this
      project would rather not make silently. A Teilaufgabe whose Aufgabe block
      has no Fallsituation text yet gets NotChecked ("Fallsituation fehlt noch"),
      same treatment as a missing Teilaufgabentext, rather than a derivation run
      on text alone (checks/llm/komp_01.py::check_komp_01).

  - id: KOMP-02
    family: B
    title: Abgeleitete Kompetenzzuordnung stimmt mit der ausgewiesenen ueberein
    rule_text: >
      Die vom Autor ausgewiesene Kompetenzzuordnung einer Teilaufgabe soll mit der
      Zuordnung uebereinstimmen, die sich aus dem Aufgabentext ergibt. Eine Abweichung
      bedeutet, dass die Aufgabe etwas anderes prueft als ausgewiesen.
    source:
      document: PflAPrV
      locator: Anlage 2 (zu § 9 Absatz 1 Satz 2)
      url: https://www.gesetze-im-internet.de/pflaprv/anlage_2.html
    authority: binding_federal
    jurisdiction: federal
    check_type: llm
    scope: teilaufgabe
    input_slice: [teilaufgabe.text, teilaufgabe.kompetenzzuordnung]
    requires: [teilaufgabe.text, teilaufgabe.kompetenzzuordnung]
    severity_default: pruefen
    mutation:
      id: MUT-KOMP-02
      operation: swap_claimed_kompetenz
      description: >
        Replace the claimed competency code with one from a different Kompetenzbereich
        while leaving the Teilaufgabe text unchanged.
      target: teilaufgabe.kompetenzzuordnung
    blocked_on: >
      Retired, not merely blocked: this rule's entire premise is comparing an
      author-declared claim against a derived value, and the schema has no author-facing
      claim field any more (teilaufgabe.kompetenzzuordnung, removed 2026-09-11) nor is one
      being reinstated -- competency evidence is now LLM-derived only
      (teilaufgabe.kompetenzzuordnung_abgeleitet via KOMP-01, checks/llm/komp_01.py). There
      is no "claimed" side left for a "derived" side to be compared against, so unlike
      KOMP-01/03/03B/06 this is not a matter of re-pointing input_slice at a new field.
    notes: >
      This was the check the claimed-versus-derived separation in the item schema existed
      for (tech doc 2.2). Kept in the catalogue as an audit trail of why the separation
      mattered once, same precedent as Family C's permanently blocked_on rules -- not
      deleted outright.

  - id: KOMP-03
    family: B
    title: Die Aufsichtsarbeit beruehrt ihren Pruefungsbereich ueberhaupt
    rule_text: >
      Die Kompetenzzuordnungen einer Aufsichtsarbeit muessen mindestens einen der
      Kompetenzschwerpunkte beruehren, die § 14 Absatz 1 PflAPrV fuer den jeweiligen
      Pruefungsbereich benennt. Eine Aufsichtsarbeit, die keinen dieser Schwerpunkte
      beruehrt, prueft den ihr zugeordneten Pruefungsbereich nicht.
    source:
      document: PflAPrV
      locator: § 14 Absatz 1
      url: https://www.gesetze-im-internet.de/pflaprv/__14.html
      quote: >
        Der schriftliche Teil der Pruefung erstreckt sich auf folgende Pruefungsbereiche aus
        den Kompetenzbereichen I bis V der Anlage 2
    authority: binding_federal
    jurisdiction: federal
    check_type: deterministic
    scope: aufsichtsarbeit
    input_slice:
      - aufgabe.metadaten.pruefungsbereich
      - aufgabe.aufgaben[].teilaufgaben[].kompetenzzuordnung_abgeleitet
    requires:
      - aufgabe.metadaten.pruefungsbereich
      - aufgabe.aufgaben[].teilaufgaben[].kompetenzzuordnung_abgeleitet
    severity_default: blocker
    mutation:
      id: MUT-KOMP-03
      operation: shift_all_kompetenzen_off_bereich
      description: >
        Replace every derived competency code with codes from Kompetenzschwerpunkte that
        belong to a different Pruefungsbereich, leaving the declared Pruefungsbereich unchanged.
      target: aufgabe.aufgaben[].teilaufgaben[].kompetenzzuordnung_abgeleitet
    notes: >
      Deterministic: intersect the item's derived Kompetenzschwerpunkte (each code reduced
      from Einzelkompetenz to Schwerpunkt form, e.g. I.3.a -> I.3) against
      rules/pruefungsbereiche.yaml's required set for the declared Pruefungsbereich. Fires
      only on an EMPTY intersection. This is deliberately the narrow, textually defensible
      reading: § 14 (1) names which Schwerpunkte a Pruefungsbereich draws on, but states no
      fractional coverage threshold, so blocker/binding_federal can only support "touches
      nothing at all" -- not "does not touch every one of them" (see KOMP-03B for that).
      scope: aufsichtsarbeit because the Pruefungsbereich correspondence is one per whole
      paper (PflAPrV § 14 (1)-(2)), not per Aufgabe block: derived codes are pooled across
      both Aufgabe 1 and Aufgabe 2 via Aufsichtsarbeit.alle_teilaufgaben() before the
      intersection is taken. A code derived only in Aufgabe 2 still counts toward coverage.
      Reads teilaufgabe.kompetenzzuordnung_abgeleitet (checks/deterministic/komp_03.py),
      populated by KOMP-01's LLM derivation (checks/llm/komp_01.py), not an author claim --
      revived 2026-09-11 against that new field after teilaufgabe.kompetenzzuordnung's
      removal had blocked this rule earlier the same day.

  - id: KOMP-03B
    family: B
    title: Die Aufsichtsarbeit deckt ihren Pruefungsbereich nur duenn ab
    rule_text: >
      Die Kompetenzzuordnungen einer Aufsichtsarbeit sollen mehr als die Haelfte der
      Kompetenzschwerpunkte beruehren, die § 14 Absatz 1 PflAPrV fuer den jeweiligen
      Pruefungsbereich benennt. Beruehrt die Aufsichtsarbeit nur einen kleinen Teil dieser
      Schwerpunkte, ist die Passung zum Pruefungsbereich schwach, auch wenn KOMP-03 formal
      nicht ausloest.
    source:
      document: Konstruktionsprinzip (projekteigene Regel, keine externe Quelle)
      locator: KOMP-03B
      quote: >
        Die Kompetenzzuordnungen einer Aufsichtsarbeit sollen mehr als die Haelfte der fuer
        ihren Pruefungsbereich benannten Kompetenzschwerpunkte beruehren.
    authority: construction_principle
    jurisdiction: federal
    check_type: deterministic
    scope: aufsichtsarbeit
    input_slice:
      - aufgabe.metadaten.pruefungsbereich
      - aufgabe.aufgaben[].teilaufgaben[].kompetenzzuordnung_abgeleitet
    requires:
      - aufgabe.metadaten.pruefungsbereich
      - aufgabe.aufgaben[].teilaufgaben[].kompetenzzuordnung_abgeleitet
    severity_default: pruefen
    mutation:
      id: MUT-KOMP-03B
      operation: thin_out_kompetenzen_coverage
      description: >
        Replace all but one derived competency code with codes from Kompetenzschwerpunkte
        that belong to a different Pruefungsbereich, so only one of the required
        Schwerpunkte remains touched.
      target: aufgabe.aufgaben[].teilaufgaben[].kompetenzzuordnung_abgeleitet
    notes: >
      Revived 2026-09-11 against teilaufgabe.kompetenzzuordnung_abgeleitet, same as KOMP-03
      (see its notes). Same lookup and reduction as KOMP-03, different threshold: fires when covered
      Schwerpunkte are strictly fewer than half the required set. authority is
      construction_principle, not binding_federal, because the 50% threshold is this
      project's own judgement call, not a fraction PflAPrV states -- so it cannot carry
      blocker (schemas/rule.py enforces this: severity ceiling derives from authority).
      Exactly half (e.g. 2 of 4) does not fire, partly because that is a defensible split
      and partly to avoid flagging a legitimately incomplete draft that has only reached
      its second of four planned Teilaufgaben (tech doc 1.5.1).
      scope: aufsichtsarbeit for the same reason as KOMP-03: coverage is pooled across
      both Aufgabe blocks via Aufsichtsarbeit.alle_teilaufgaben(), not judged per block.

  - id: KOMP-04
    family: B
    title: Verteilung der Anforderungsniveaus nicht degeneriert
    rule_text: >
      Die Anforderungsniveaus der Teilaufgaben sollen sich ueber mehr als eine Stufe
      verteilen. Eine Aufsichtsarbeit, deren Teilaufgaben alle auf Anforderungsbereich I
      liegen, prueft keine Kompetenz im Sinne der Anlage 2, sondern Reproduktion.
    source:
      document: Konstruktionsprinzip (projekteigene Regel, keine externe Quelle)
      locator: KOMP-04
      quote: >
        Die Anforderungsniveaus der Teilaufgaben einer Aufsichtsarbeit sollen mehr als eine
        Stufe umfassen.
    authority: construction_principle
    jurisdiction: federal
    check_type: deterministic
    scope: aufsichtsarbeit
    input_slice:
      - aufgabe.aufgaben[].teilaufgaben[].anforderungsniveau
      - aufgabe.aufgaben[].teilaufgaben[].punkte
    requires:
      - aufgabe.aufgaben[].teilaufgaben[].anforderungsniveau
    severity_default: pruefen
    mutation:
      id: MUT-KOMP-04
      operation: flatten_anforderungsniveau
      description: Set every Teilaufgabe's Anforderungsniveau to I, across both Aufgabe blocks.
      target: aufgabe.aufgaben[].teilaufgaben[].anforderungsniveau
    notes: >
      scope: aufsichtsarbeit: distribution is judged across the whole paper (both Aufgabe
      blocks pooled via Aufsichtsarbeit.alle_teilaufgaben()), not within one block. A block
      that is internally all-level-I does not fire alone if the other block supplies variety;
      whether that is the right bar or whether each block should independently show variety
      is a judgement call worth revisiting once real drafts are seen.

  - id: KOMP-05
    family: B
    title: Die Fallsituationen der drei Aufsichtsarbeiten variieren
    rule_text: >
      Die Fallsituationen der drei Aufsichtsarbeiten einer Pruefung muessen insgesamt in
      Altersstufe, sozialem und kulturellem Umfeld sowie Versorgungsbereich variieren.
      Drei Fallsituationen im gleichen Setting mit der gleichen Altersgruppe erfuellen
      diese Anforderung nicht.
    source:
      document: PflAPrV
      locator: § 14 Absatz 2 Satz 2
      url: https://www.gesetze-im-internet.de/pflaprv/__14.html
      quote: >
        Die Fallsituationen fuer die drei Aufsichtsarbeiten sollen insgesamt variiert werden
        in Bezug auf 1. die Altersstufe, der die zu pflegenden Menschen angehoeren, 2. das
        soziale und kulturelle Umfeld der oder des zu pflegenden Menschen, 3. die
        Versorgungsbereiche, in denen die Fallsituationen verortet sind.
    authority: binding_federal
    jurisdiction: federal
    check_type: hybrid
    scope: aufgabenset
    input_slice:
      - aufgabe.aufgaben[].fallsituation.text
      - aufgabe.aufgaben[].fallsituation.altersgruppe
      - aufgabe.aufgaben[].fallsituation.versorgungsbereich
      - aufgabe.geschwister_aufgaben
    requires: [aufgabe.geschwister_aufgaben]
    severity_default: blocker
    mutation:
      id: MUT-KOMP-05
      operation: homogenise_sibling_fallsituationen
      description: >
        Set the Altersgruppe and Versorgungsbereich of every Aufgabe block across all three
        sibling Aufsichtsarbeiten to the same values.
      target: aufgabe.geschwister_aufgaben
    notes: >
      The only cross-item rule in the catalogue, and the reason the item schema carries a
      sibling reference as a first-class field. On a single item the precondition is unmet
      and the runner emits NotChecked rather than a flag.
      Compares at the Aufgabe-block level, not the whole-paper level: each Aufsichtsarbeit
      now contributes 2 Fallsituationen (Aufgabe 1, Aufgabe 2), so three sibling
      Aufsichtsarbeiten give 6 Fallsituationen total, and "insgesamt variiert" (§ 14 (2))
      is judged across all 6, since that is the actual granularity at which a Fallsituation
      theme exists. This is an interpretation choice PflAPrV does not spell out for the
      two-blocks-per-paper structure -- worth confirming with a Fachpruefer before relying
      on it as more than a demonstration, same caveat class as the KOMP-06 Anlage-2 count
      (tech doc 12).

  - id: KOMP-06
    family: B
    title: Jede ausgewiesene Kompetenz existiert in Anlage 2
    rule_text: >
      Jeder ausgewiesene Kompetenzcode muss in Anlage 2 PflAPrV vorkommen. Ein Code, der
      nur in Anlage 1 steht, bezeichnet eine Kompetenz der Zwischenpruefung und ist nicht
      Gegenstand der staatlichen Pruefung.
    source:
      document: PflAPrV
      locator: Anlage 2 (zu § 9 Absatz 1 Satz 2)
      url: https://www.gesetze-im-internet.de/pflaprv/anlage_2.html
    authority: binding_federal
    jurisdiction: federal
    check_type: deterministic
    scope: teilaufgabe
    input_slice: [teilaufgabe.kompetenzzuordnung_abgeleitet]
    requires: [teilaufgabe.kompetenzzuordnung_abgeleitet]
    severity_default: blocker
    mutation:
      id: MUT-KOMP-06
      operation: claim_anlage_1_only_kompetenz
      description: >
        Replace a derived code with one that exists in Anlage 1 but not in Anlage 2, and
        with one that exists in neither.
      target: teilaufgabe.kompetenzzuordnung_abgeleitet
    notes: >
      Never had a code implementation before this schema's competency evidence was
      LLM-derived (checks/deterministic/komp_06.py, new 2026-09-11) rather than
      author-declared. It reads `anlage_2_authoritative` in rules/kompetenzen.yaml, which is
      parsed from PflAPrV's own Anlage 2 text (85 codes) — NOT the Lehrplan's citations (79
      codes); see kompetenzen.yaml meta.komp_06_finding for why that distinction matters.
      Since KOMP-01's derivation (checks/llm/komp_01.py) already filters its output to the
      candidate set it built (checks/llm/kompetenz_candidates.py), which is itself always a
      subset of Anlage 2, this should rarely fire in practice now -- it stays valuable as a
      guardrail against a candidate-set construction bug or a gateway that stops filtering
      correctly, rather than as the primary defect-catcher it would have been against an
      author's own claim (where a mistyped or invented code was the common real defect).

  - id: KOMP-07
    family: B
    title: Situationsmerkmale der Teilaufgabe passen zur ausgewiesenen CE
    rule_text: >
      Die Handlungsanlaesse, Kontextbedingungen und Handlungsmuster, die eine Teilaufgabe fuer
      ihre curriculare Einheit angibt, sollen denen entsprechen, die der Lehrplan fuer diese
      curriculare Einheit vorsieht. Eine Teilaufgabe, deren angegebener Handlungsanlass in
      keiner Beziehung zur ausgewiesenen CE steht, prueft die Kompetenzen dieser CE nicht.
    source:
      document: Lehrplaene und Ausbildungsplaene fuer die Berufsfachschule fuer Pflege (StMUK / ISB Bayern, Juli 2020)
      locator: Situationsmerkmale je curriculare Einheit
      quote: >
        Inhalte/Situationsmerkmale: Handlungsanlaesse, Kontextbedingungen, Handlungsmuster
    authority: official_state
    jurisdiction: BY
    check_type: llm
    scope: teilaufgabe
    input_slice:
      - teilaufgabe.situationsmerkmale
      - aufgabe.fallsituation.text
    requires:
      - teilaufgabe.situationsmerkmale.curriculare_einheit
    severity_default: pruefen
    mutation:
      id: MUT-KOMP-07
      operation: swap_curriculare_einheit
      description: >
        Change one Teilaufgabe's declared situationsmerkmale.curriculare_einheit to a
        curriculare Einheit whose Situationsmerkmale do not match that Teilaufgabe's
        Handlungsanlaesse/Kontextbedingungen/Handlungsmuster, leaving those unchanged.
      target: teilaufgabe.situationsmerkmale.curriculare_einheit
    notes: >
      The most differentiating check in the tool: nothing on the market checks whether a
      case scenario's Handlungsanlass matches the curricular unit whose competencies the
      item claims to assess, and it is defensible because both sides come from binding
      documents. Compares only the three dimensions the Lehrplan structures per CE —
      Akteure and Erleben/Deuten/Verarbeiten are prose there, not a per-CE list.
      Re-scoped from aufgabe to teilaufgabe by the schema change of 2026-09-11: the CE claim
      and its Situationsmerkmale moved from Aufgabe.ce_bezug (one per block) down to
      Teilaufgabe.situationsmerkmale.curriculare_einheit (one per Teilaufgabe), since a
      block's several Teilaufgaben can legitimately target different CEs off one shared
      Fallsituation. The block's Fallsituation.text stays in input_slice as context the model
      needs to judge whether a Teilaufgabe's claimed Situationsmerkmale actually arise from
      that prose; the comparison target for the mismatch itself is now the Teilaufgabe, not
      the whole block.
