  redemittel: Grundsätzlich ist … Aus professioneller Sicht … Meiner Meinung nach … Meiner Überzeugung
    nach ist … Aus meiner Position heraus … Ich bin der Ansicht, dass… Ich sehe den Grund für … in … Ein
    entscheidender Nachteil/Vorteil ist … Ein negativer/positiver Aspekt ist … Insgesamt kann man sagen,
    dass … Insgesamt überwiegt …
  example_task: Bewerten Sie die präoperative Haarentfernung bei Herr Peterson anhand von 2 Argumenten.
  example_answer: Grundsätzlich darf die Haarentfernung nur aufgrund ärztlicher Anordnung erfolgen. Ein
    entscheidender Vorteil ist die Reduzierung des Infektionsrisikos im Operationsgebiet. Ein weiterer
    Vorteil ist die bessere Sicht im Operationsgebiet für den Chirurgen bei starker Behaarung. Insgesamt
    kann man also sagen, dass eine präoperative Haarentfernung vorteilhaft ist.
