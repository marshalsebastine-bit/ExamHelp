  example_task: Entwickeln Sie 1 problembezogene aktuelle Pflegediagnose nach dem PÄS/PES-Format mit 1
    passendenden Ressource von Herrn Franz. Leiten Sie dazu 1 Pflegeziel ab und planen Sie 1 Pflegeintervention.
  example_answer: 'Anhand der Situation kann man Für Herrn Franz die Pflegediagnose „Beeinträchtigte körperliche
    Mobilität“ entwickeln. P: Beeinträchtigte körperliche Mobilität Ä/ E: Schmerzen in den Gelenken aufgrund
    von Arthrose S: Schwierigkeiten beim Gehen, eingeschränkte Bewegungsfreiheit, Steifigkeit der Gelenke,
    Unsicherheit beim Gehen und Stehen Ressource: Herr Franz zeigt eine hohe Compliance und möchte seine
    Mobilität durch Bewegungsübungen verbessern. Ziel: Herr Franz geht innerhalb von zwei Wochen, mit
    minimaler Unterstützung 15 Meter ohne Pausen, wobei die Schmerzintensität auf der numerischen Rangskala
    von 0-10 unter 4 bleibt. Intervention: Tägliche Anleitung und Unterstützung bei aktiven und passiven
    Bewegungsübungen zur Förderung der Gelenkbeweglichkeit und Muskelkraft. Literatur Gesetz über die
    Pflegeberufe (PflBG) vom 17. Juli 2017 (BGBl. I 2017, Nr. 45, S. 2581), zuletzt geändert durch Artikel
    2a des Gesetzes vom 12. Dezember 2023 (BGBl. I 2023, Nr. 359) Kamm A./ Roche J. (2025): Handreichung
    02. Sprachsensibel Prüfen in der Pflegeausbildung . abrufbar unter: www. Pflegeplus -sprache.de PflAPrV
    (2018): Pflegeberufe‑ Ausbildungs‑ und Prüfungsverordnung vom 2. Oktober 2018, i. d. F. vom 02.10.2018,
    BGBl. I 2018'
