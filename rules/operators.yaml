  example_task: Beschreiben Sie 2 Assessmentinstrumente zur Erfassung der Schmerzen von Frau Rossi.
  example_answer: Eine Möglichkeit ist die numerische Rating-Skala. Eine NRS ist eine eindimensionale
    Schmerzskala, Patienten können damit ihren subjektiv empfundenen Schmerz einordnen. Hierzu wird der
    Patient aufgefordert, seine Schmerzen einer Skala von 0 bis 10 zuzuordnen. "10" steht für "stärkste
    vorstellbare Schmerzen", "0" für "kein Schmerz". Eine zweite Möglichkeit ist ein Schmerztagebuch.
    Damit können die Schmerzsituationen und der Schmerzverlauf über einen längeren Zeitraum (meist 14
    Tage) systematisch erfasst und dokumentiert werden. Dabei werden das Ausmaß und der Verlauf der Schmerzen
    genauer erfasst. Ein Schmerztagebuch hilft Betroffenen, ihre Schmerzen selbst einzuschätzen und mögliche
    Schmerzauslöser zu identifizieren.
  source_row: null
