  example_task: Vergleichen Sie Infusionen und Transfusionen anhand von 2 Unterschieden und 2 Gemeinsamkeiten.
  example_answer: 'Die Unterschiede von Transfusionen und Infusionen sind: Transfusionen dürfen nur vom
    Arzt angehängt und gestartet werden. Transfusionen müssen gekühlt gelagert werden. Die Gemeinsamkeiten
    von Transfusionen und Infusionen sind: Bei Beiden müssen Unversehrtheit und Haltbarkeit überprüft
    werden. Die Vorbereitung erfolgt unter denselben hygienischen Bedingungen. Anforderungsbereich III:
    Sachverhalte neu erarbeiten und reflektieren – Problemlösen und Werten'
