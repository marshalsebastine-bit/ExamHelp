  example_task: Stellen Sie der Aussage von Frau Sing „In der Psychiatrie werden alle nur ruhiggestellt!“
    2 professionelle Argumente gegenüber.
  example_answer: Der Aussagen von Frau Sing ist entgegenzuhalten, dass in der Psychiatrie Menschen mit
    akuten psychischen Erkrankungen aufgenommen werden. Ihre Symptome machen gegebenenfalls die Verabreichung
    von Sedativa notwendig. Sie werden so beispielsweise vor fremd- und selbstgefährdendem Verhalten geschützt.
    Außerdem wird der Einsatz von sedierenden Medikamenten ausschließlich im Einzelfall vom behandelnden
    Arzt angeordnet und niemals pauschal ausgeführt.
