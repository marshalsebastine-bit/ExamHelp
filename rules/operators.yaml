meta:
  id: operators
  title: Operatorentabelle fuer die schriftliche Pflegepruefung (Bayern)
  purpose: 'Lookup table for FORM-03 (operator is on the list) and FORM-04 (operator matches the declared
    Anforderungsniveau). A set-membership test, never a similarity search: an invented operator must return
    nothing rather than its nearest real neighbour (repo review 2.1).'
  source:
    document: 'PflegePlus Handreichung 01: Umgang mit Operatoren in der Pflegeausbildung'
    section: 3.2 Erweiterte Operatorenliste
    publisher: Kamm / Roche, PflegePlus (ILS GmbH), 2025
    url: https://www.pflegeplus-sprache.de
  authority: third_party_advisory
  binding_status: unverified
  generated_by: scripts/migrate_operators.py
  open_questions:
  - The official Liste der Operatoren des Bay. StMUK (section 3.1 of the same document) is scanned images
    with no extractable text. It must be obtained first-hand from StMUK; it cannot be recovered from this
    PDF without OCR (repo review 4.2, 5).
  - Section 3.2's preamble states it reproduces the binding StMUK operators verbatim and extends them,
    but does not mark which entries are binding. Until the StMUK list is in hand, FORM-03 cannot distinguish
    'not an approved operator' from 'approved only in the extended list'.
  - Licence for the Erweiterte Operatorenliste is unresolved (repo review 5, action 3).
  counts:
    entries: 28
    distinct_operators: 27
    by_anforderungsbereich:
      I: 9
      II: 11
      III: 8
