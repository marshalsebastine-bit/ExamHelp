  example_answer: 'Die Auswirkungen der Fatigue zeigen sich bei Frau Horneber durch: Konzentrationsstörungen,
    zum Beispiel ist Frau Horneber oft unkonzentriert und weiß dann nicht mehr was sie als nächstes tun
    wollte, fängt dann oft wieder von vorne an. Müdigkeit/Energiemangel, zum Beispiel hat Frau Horneber
    ein erhöhtes Bedürfnis sich auszuruhen und muss auch bei einfachen Tätigkeiten immer öfter eine Pause
    einlegen, was dazu führt, dass diese oft sehr lange dauern.'
