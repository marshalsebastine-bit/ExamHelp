  display: diskutieren
  anforderungsbereich: III
  anforderungsbereich_titel: Sachverhalte neu erarbeiten und reflektieren – Problemlösen und Werten
  task_formulation: Diskutieren Sie …
  explanation: Vor- und Nachteile einer vorgegebenen Information beschreiben und ein Fazit schreiben.
    Ganze Sätze formulieren.
  redemittel: Grundsätzlich kann man sagen, dass … Es ist wichtig, dass … Ein häufiges Argument ist, dass
    … Ein Gegenargument ist, dass … Darüber hinaus … Im Gegensatz dazu … Vorteile sind … Nachteile sind
    … Abschließend kann man sagen … Deshalb/Daher … Folglich ist … Daraus folgt, dass … Offen bleibt,
    wie … Dies ist abzugrenzen von …, weil …
  example_task: Diskutieren Sie anhand von 3 Vorteilen und 3 Nachteilen die parenterale Ernährung von
    Klaus.
  example_answer: Grundsätzlich kann man sagen, dass die intravenöse Versorgung mit Nährstoffen bei einem
    Kind gut überlegt werden muss. Vorteile der parenteralen Ernährung sind die Sicherstellung der Versorgung
    mit lebensrettenden Nährstoffen sowie die Vermeidung von Belastung des geschädigten Verdauungssystems
    und darüber hinaus die schnelle und präzise Dosierung der Nährstoffzusammensetzung. Nachteile sind
    das erhöhte Infektionsrisiko durch den Katheter, Komplikationen wie z.B. Thrombosen durch die Katheteranlage
    sowie eine beeinträchtigte Darmfunktion durch die langfristige Nichtnutzung des Verdauungstrakts.
    Abschließend kann man sagen, dass ein individuell abgestimmtes Vorgehen und eine enge interdisziplinäre
    Zusammenarbeit entscheidend sind, um das bestmögliche Ergebnis für Klaus zu erzielen.
