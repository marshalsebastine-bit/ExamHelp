  example_task: Ordnen Sie anhand von 3 Beobachtungen bei Frau Williams die passende Sterbephase nach
    Kübler-Ross zu.
  example_answer: Anhand der Beobachtungen bei Frau Williams kann man erkennen, dass sie sich in der Phase
    4 (Depression) nach Kübler-Ross befindet. Dies wird deutlich an ihrem Rückzug von anderen Menschen,
    da sie kaum noch Besuch empfangen möchte. Das kann man außerdem daran erkennen, dass sie häufig weint
    und sagt, „dass alles keinen Sinn mehr hat“. Eine weitere Beobachtung ist, dass sie kaum noch isst
    und das Interesse an früher wichtigen Dingen, wie dem Lesen oder Handarbeiten, verloren hat. Entsprechend
    zeigt sich eine tiefe Traurigkeit und Resignation in ihrem Verhalten.
  source_row: null
