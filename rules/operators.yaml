  example_task: Beurteilen Sie die Verweigerung der geplanten transurethralen Prostataresektion durch
    Herrn Hartmann anhand von 3 Aspekten.
  example_answer: Grundsätzlich ist der medizinische Eingriff laut ärztlicher Aussage zwingend erforderlich
    um die Gesundheit von Herrn Hartmann wiederherzustellen. Die Ablehnung Herrn Hartmanns kann zahlreiche
    persönliche Gründe haben, wie z.B. Angst vor der Narkose oder Libido Verlust. Aus professioneller
    Sicht überwiegt die Autonomie des Patienten. Patientenautonomie ist ein grundlegendes Prinzip der
    medizinischen Ethik, das den Patienten das Recht einräumt, informierte Entscheidungen über ihre medizinische
    Versorgung zu treffen. Eine Durchführung des Eingriffs ohne die Zustimmung des Patienten würde es
    sich also um Körperverletzung handeln.
