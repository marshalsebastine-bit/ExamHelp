  example_task: Formulieren Sie anhand der Fallsituation 4 präventive Maßnahmen zur Vermeidung von Burnout.
  example_answer: 'Anhand der Situation von Max sind folgende 4 Maßnahmen zur Vermeidung von Burnout zu
    nennen: Ressourcen sollten gestärkt werden, z.B. durch soziale Kontakte. Einstellung sollten geändert
    werden, z.B. durch blockieren von negativen Glaubenssätzen. Work-Life-Balance sollte gefördert werden,
    z.B. durch regelmäßiges Wahrnehmen von Freizeitangeboten. Umgang mit Zeit und Energie sollte ausgeglichen
    sein, z.B. durch Zeitmanagement nach der Eisenhower-Methode. Anforderungsbereich II: Vertraute Sachverhalte
    in neuem Zusammenhang benutzen (Transfer) – Anwenden von Kenntnissen'
