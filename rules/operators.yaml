  example_task: Erläutern Sie 3 wichtige Maßnahmen die Sie bei der Pflege des zentralen Venenkatheters
    von Frau Nuss beachten.
  example_answer: 'Die wichtigsten Aspekte bei der Pflege des zentralen Venenkatheters (ZVK) von Frau
    Nuss sind: Verlegte Lumen dürfen nie durchgespült werden, da das Durchspülen zum Beispiel zu schweren
    Komplikationen führen kann. Die ZVK-Zuleitung ist immer steril zu behandeln, dazu müssen zum Beispiel
    sterile Handschuhe getragen werden. Das Lumen des ZVKs muss offengehalten werden. Das kann zum Beispiel
    über einen Infusomat 10ml/h oder Perfusor 2 ml/h erfolgen. Vor dem Abstöpseln sollte jeder Schenkel
    mit mindesten 10ml NaCL 0,9% durchgespült werden.'
