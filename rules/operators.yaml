  example_task: Fassen Sie anhand von 3 Aspekten die Vorteile von Supervision in der Pflege zusammen.
  example_answer: 'Zusammenfassend kann man sagen, dass Supervision in der Pflege folgende Vorteile hat:
    Supervision verbessert die Kommunikation am Arbeitsplatz und stärkt eine wertschätzende und achtsame
    Kommunikation im Team. Supervision unterstützt Konfliktklärung im Team und fördert somit die kollegiale
    und konstruktive Zusammenarbeit. Supervision leistet einen Beitrag zur Organisationsentwicklung und
    macht systematische Zusammenhänge sichtbar.'
