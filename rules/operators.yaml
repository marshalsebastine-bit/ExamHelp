  example_answer: In der Fallsituation liegt eine freiheitsentziehende Maßnahme vor, dies kann man daran
    erkennen, dass der zu Pflegende durch das Anbringen der Bettgitter am Verlassen des Bettes gehindert
    wird. Allerdings wird deutlich, dass dies auf ausdrücklichen Wunsch des zu Pflegenden durchgeführt
    wird. Es muss deshalb kein richterlicher Beschluss eingeholt werden.
