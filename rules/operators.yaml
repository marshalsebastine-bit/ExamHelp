  example_task: Definieren Sie den Begriff Inklusion anhand von 2 Merkmalen.
  example_answer: Unter Inklusion versteht man, dass Menschen mit Behinderung ihr Leben nicht mehr an
    vorhandene Strukturen anpassen müssen. Die Gesellschaft ist dafür verantwortlich, dass alle Menschen
    von Anfang an am gesellschaftlichen Leben teilhaben können. Das gilt auch für Menschen mit Behinderung.
