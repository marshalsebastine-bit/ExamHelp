  display: interpretieren
  anforderungsbereich: III
  anforderungsbereich_titel: Sachverhalte neu erarbeiten und reflektieren – Problemlösen und Werten
  task_formulation: Interpretieren Sie …
  explanation: Zu einer vorgegebenen Information oder Situation die Bedeutung beschreiben und die eigene
    Sichtweise erklären. Ganze Sätze (im Konjunktiv) formulieren.
  redemittel: Die Aussage könnte bedeuten, dass … Um die Bedeutung zu verstehen, … Es scheint, dass …
    Aus der Sichtweise von … Um den Hintergrund zu betrachten, … Es könnte gemeint sein, dass … Möglich
    wäre … Meiner Interpretation nach … Die Angaben basieren auf …
  example_task: Interpretieren Sie die Aussage von Frau Katzbach „Was wollen Sie als Krankenschwester
    da schon machen?“ anhand einer Kommunikationstheorie.
  example_answer: 'Um die Aussage von Frau Katzbach zu verstehen, kann diese anhand der Kommunikationstheorie
    von Schulz von Thun interpretiert werden. Dazu müssen die 4 Ebenen einer Nachricht analysiert werden:
    Sachebene: Auf der Sachebene könnte Frau Katzbach eine objektive Information, nämlich die Rolle der
    Pflegefachperson in der Situation ansprechen. Selbstoffenbarungsebene: Frau Katzbach zeigt ihre eigene
    Gefühlsebene (z.B. Skepsis oder Verzweiflung über die Situation). Sie könnte sich machtlos oder hilflos
    fühlen und dies auf die Pflegefachperson projizieren. Beziehungsebene: Fr. Katzbach könnte ein Machtgefälle
    zum Ausdruck bringen, bei dem sie die Pflegefachperson als weniger einflussreich oder unwichtig ansieht.
    Apellebene: Frau Katzbach könnte mit ihrer Aussage etwas erreichen wollen. Z.B., dass jemand anderes
    (z.B. der Arzt) eingreift oder dass die Pflegefachperson genauer erklärt, was sie tatsächlich tun
    kann.'
