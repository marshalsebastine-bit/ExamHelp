  example_task: Leiten Sie anhand der Risikofaktoren von Herrn Maier 5 Maßnahmen zur Prävention eines
    Bandscheibenvorfalles ab.
  example_answer: 'Aus den Risikofaktoren von Herrn Maier lassen sich folgende 5 pflegerische Maßnahmen
    zur Prävention eines Bandscheibenvorfalls ableiten: Anleitung zu rückenschonender Arbeitsweise um
    die Fehlbelastung der Wirbelsäule zu vermeiden. Anleitung zu regelmäßigem Rückentraining um durch
    gezielte Kräftigungsübungen die Rücken- und Bauchmuskulatur zu stärken. Beratung zur Gewichtsreduktion
    und gesunden Ernährung um die Druckbelastung auf die Bandscheiben zu reduzieren. Ergonomische Gestaltung
    des Arbeitsplatzes mit angepasster Arbeitshöhe und häufigen Positionswechseln. Förderung von Bewegung
    und Haltungswechseln im Alltag um die Bandscheiben regelmäßig zu entlasten und die Durchblutung zu
    fördern.'
  source_row: null
