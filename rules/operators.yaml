  example_task: 'Nehmen Sie mit 3 Argumenten Stellung zur Aussage von Ingrid: „Bei der Pflege von Kindern
    und Erwachsenen gibt es doch keinen Unterschied.“'
  example_answer: 'Als professionell Pflegende vertrete ich die Meinung, dass es bei der Versorgung von
    Kindern einige wichtige Besonderheiten gibt. Diese sind unter anderem: Säuglinge und Kinder können
    sich je nach Alter verbal nicht klar äußern. Die pflegerische Beobachtung nimmt hier einen großen
    Stellenwert ein. Bei der Versorgung von Kindern sollen Pflegende die Bezugsperson in die Körperpflege
    integrieren, dies erfordert besondere Kenntnisse zum Umgang mit den Eltern. Kinder reagieren auf unangenehme
    Dinge oft mit Abwehrhaltung. Der professionelle Umgang damit erfordert einen speziellen pflegerischen
    Umgang.'
  source_row: null
