  example_task: Begründen Sie die regelmäßige und gründliche Durchführung der Mundpflege bei Frau Herbert
    anhand von 2 Aspekten.
  example_answer: Eine regelmäßige und gründliche Mundpflege bei Frau Herbert ist wichtig, weil eine unzureichende
    Mundhygiene zu Infektionen im Mundbereich, wie zum Beispiel Gingivitis oder Parodontitis führen kann.
    Darüber hinaus kann es gerade bei immobilen Patienten durch eine hohe Keimlast im Mundbereich zu Infektionen
    der Atemwege, wie zum Beispiel einer Pneumonie kommen. Eine sorgfältige Mundpflege trägt dazu bei,
    dass das Wohlbefinden und die körperliche Gesundheit von Frau Herbert unterstützt werden.
