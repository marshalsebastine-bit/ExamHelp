meta:
  id: situationsmerkmale
  title: Situationsmerkmale je curriculare Einheit
  purpose: The Lehrplan's Situationsprinzip vocabulary. Structures the Fallsituation fields of the item
    schema (tech doc 2.2) and supplies the comparison target for KOMP-07.
  dimensions_structured_per_ce:
  - handlungsanlaesse
  - kontextbedingungen
  - handlungsmuster
  dimensions_prose_only:
  - akteure
  - erleben_deuten_verarbeiten
  dimensions_note: The Lehrplan sets only Handlungsanlaesse, Kontextbedingungen and Handlungsmuster as
    table rows per CE. Akteure and Erleben/Deuten/Verarbeiten are prose in the introduction and the didaktischer
    Kommentar, so there is no per-CE list to compare against. The item schema used to keep an `akteure`
    field for this reason, but removed it on 2026-09-11, since with no per-CE list to check it against it
    carried no evidence for any rule. KOMP-07 compares only the three structured dimensions.
  source:
    document: Lehrplaene und Ausbildungsplaene fuer die Berufsfachschule fuer Pflege (StMUK / ISB Bayern,
      Juli 2020)
    authority: official_state
  generated_by: scripts/extract_lehrplan.py
  extraction_note: Extracted from a PDF table set in narrow columns. Content is indicative for KOMP-07
    development and needs a spot review against the document before KOMP-07 is scored.
curriculare_einheiten:
- ce: CE 01
  titel: Ausbildungsstart – Pflegefachfrau/Pflegefachmann werden
  handlungsanlaesse:
  - Ankommen in der Lerngruppe bzw. in der Schule
  - Ankommen im Team bzw. in der Pflegepraxis
  - berufliche Identität entwickeln
  - Kontaktaufnahme mit zu pflegenden Menschen (der „fremde Mensch“) in verschiedenen Altersstufen
  kontextbedingungen:
  - Lernprozesse in der Ausbildung und Lernorte – Pflegeschule, simulative Lernumgebungen, Pflegepraxis
  - 'Instrumente der schulischen und praktischen Ausbildung: Curriculum, Ausbildungsplan, Ausbildungsnachweis'
  - 'vielfältiges Spektrum gesundheitsbezogener Einrichtungen und pflegerischer Handlungsfelder Makroebene
    Gesetzlicher Rahmen: 29 Gestaltung von Arbeits- und Beziehungsprozessen CE O1 Ausbildungsstart – Pflegefachfrau/Pflegefachmann
    werden'
  - gesetzliche Grundlagen der Ausbildung, u. a. Pflegeberufegesetz (PflBG), insbesondere Berufsbezeichnung
    Pflegefachfrau/Pflegefachmann
  - Datenschutz, Schweigepflicht
  - Arbeitsrecht, u. a. Ausbildungsvertrag, Arbeitsvertrag
  - Patientensicherheit
  - Betriebsverfassungsgesetz (Personal)
  handlungsmuster:
  - Lernen in der Gruppe, Gruppendynamik
  - Reflexion pflegerischer Vorerfahrungen und der Lernbiografie (inkl. digitaler Kompetenzen)
  - 'Einführung in die Beziehungsgestaltung: Kommunikation, Fürsorge, Kultursensibilität, ethische Haltung,
    Empathie'
  - Pflegeprozess als Problemlösungs- und Beziehungsprozess
  - Einführung in die Grundlagen der Pflegewissenschaft bzw. in das professionelle Pflegehandeln (z. B.
    Grundbegriffe, Gegenstand)
  - sich im Kontext zurechtfinden (ausgewählte Aspekte, wie z. B. EDV)
  - Kontakt zum Team aufnehmen
  - Aufmerksam-Sein für die eigene Gesundheit und den Schutz vor physischen und psychischen Belastungen
  - Handlungsmuster zu ausgewählten Szenarien, die den Auszubildenden begegnen werden Wissensgrundlagen
  - kurzer Überblick über die Geschichte des Pflegeberufes – auch internationale Vergleiche
  - kurzer Überblick Pflegeprozessgestaltung, u. a. der sechsschrittige Pflegeprozess und der vierschrittige
    Pflegeprozess im Sinne des Strukturmodells
  - kurzer Überblick über die Begriffe Pflegediagnoseklassifikation (NANDA International, Inc.; NANDA-I),
    Pflegeinterventionsklassifikation (Nursing Intervention Classification; NIC), Pflegeergebnisklassifikation
    (Nursing Outcome Classification; NOC)
  - ICN–Ethikkodex für Pflegende
  - 'Einstieg in Kommunikationsmodelle: Sender-Empfänger-Modell (Vertiefung CE 03)'
  - EDV in der Ausbildung (Arbeits- und Präsentationsmittel, vgl. auch Mediencurriculum der Schule)
  - Grundprinzipien der EDV- und papiergestützten Pflegedokumentation
  - die Bundesrepublik als wertgebundener, freiheitlicher, demokratischer Staat, u. a. Menschenbild des
    Grundgesetzes (GG) und Grundrechte 30 Gestaltung von Arbeits- und Beziehungsprozessen
- ce: CE 02
  titel: Zu pflegende Menschen in der Bewegung und Selbstversorgung unterstützen
  handlungsanlaesse:
  - entwicklungs- und gesundheitsbedingt beeinträchtigte körperliche Mobilität
  - beeinträchtigte Mobilität im Bett
  - beeinträchtigte Gehfähigkeit
  - bewegungsarmer Lebensstil
  - Gesundheitsrisiken durch Mobilitätsbeeinträchtigungen, z. B. erhöhtes Sturzrisiko
  - Gefahr einer verzögerten sensomotorischen Entwicklung (Vertiefung in CE 10) Auszubildende
  - berufliche Gesundheitsrisiken und Gefahren
  - Selbstfürsorge, insbesondere für die Gesunderhaltung des eigenen Bewegungsapparats sowie die Erhaltung
    und Weiterentwicklung der persönlichen Mobilität als zentrales Moment der pflegerischen Interaktion
  - Pflegebedürftigkeit
  - Pflegephänomene, z. B. Hilflosigkeit, Abhängigkeit, Fremdheit, Scham, Bedürfnis nach Zuwendung, Orientierung
    und Berührung
  - gesundheits- oder entwicklungsbedingte Beeinträchtigungen in der Selbstversorgung (Körperpflege bzw.
    Kleiden, Nahrungs- und Flüssigkeitsaufnahme, Ausscheidung)
  - pflegebedingte Notwendigkeit der Beobachtung des Gesundheitszustands (inkl. der Vitalwerte)
  - (Risiko von) Veränderungen des Hautzustands und Erfordernis entsprechend ausgewählter Prophylaxen,
    z. B. Intertrigoprophylaxe, Dekubitusprophylaxe (vgl. CE 02 A)
  - Bedarf an Entwicklungs- und Gesundheitsförderung über Berührung
  - Mangelernährung
  - Flüssigkeitsdefizit
  - beeinträchtigte Harnausscheidung
  - beeinträchtigte Stuhlausscheidung
  - ggf. Schlafstörung oder Unruhe (sollte in anderen curricularen Einheiten wieder aufgegriffen werden)
  kontextbedingungen:
  - unterschiedliche Einrichtungen und Versorgungsbereiche im Orientierungseinsatz
  - technische und digitale Hilfsmittel zur Unterstützung bei der Bewegungsförderung und Positionierung
    und Regelungen zu deren Verfügbarkeit (z. B. rechtliche Regelungen zu Medizinprodukten)
  - Rechtsgrundlagen in Bezug auf Haftung, Arbeitsschutz und Sicherheit der zu pflegenden Menschen
  - Arbeitssicherheit und Unfallverhütung
  - verschiedene Versorgungsbereiche der Pflege (insbesondere solche, in denen die Lernenden im Orientierungseinsatz
    eingesetzt werden)
  - Angehörige und Bezugspersonen, die bei der Pflege anwesend sein können
  handlungsmuster:
  - Fähigkeiten und Ressourcen sowie Beeinträchtigungen in der Mobilität unter Nutzung ausgewählter Assessmentverfahren
    beobachten und beschreiben bzw. dokumentieren
  - Menschen bei Alltagsaktivitäten in ihrer Mobilität unterstützen und bei Bedarf technische und digitale
    Hilfsmittel nutzen
  - eine sichere Umgebung für Menschen aller Altersstufen auch mit Beeinträchtigungen des Sehens und Hörens
    gestalten
  - Risiken bei Beeinträchtigungen der Mobilität systematisch personen- und umgebungsbezogen einschätzen
    und dokumentieren 48 Unterstützung bei der selbstbestimmten Lebensführung und Selbstpflege CE 02 A
    Mobilität interaktiv, gesundheitsfördernd und präventiv gestalten sowie individuelle Pflegemaßnahmen
    planen, durchführen und evaluieren
  - Angebote zur Mobilitätsförderung und -erhaltung sowie zur Entwicklungsförderung unter Einbezug entsprechender
    Bewegungskonzepte planen, durchführen und evaluieren
  - Menschen über die Bedeutung von Mobilität in Bezug auf Gesundheitsförderung und Prävention informieren
  - Menschen zu hilfreichen Bewegungsabläufen instruieren
  - Menschen bei Orts- und Positionswechseln unterstützen
  - Maßnahmen zur Förderung und Erhaltung der Mobilität im pflegerischen und therapeutischen Team besprechen
    und abstimmen
  - das eigene Handeln an ausgewählten Expertenstandards der Pflege orientieren − Überblick zu ausgewählten
    Standards in Verbindung mit Mobilitätsförderung und -einschränkungen Auszubildende
  - das eigene Gesundheits- und Bewegungsverhalten reflektieren
  - eigene Bewegungsabläufe analysieren und vor dem Hintergrund pflegerischer Bewegungskonzepte reflektieren
  - hilfreiche Bewegungsabläufe und Interaktionen in die pflegerische Unterstützung von Menschen aller
    Altersstufen integrieren und deren Wirkung auf den eigenen Körper evaluieren
  - eigene Grenzen der körperlichen Belastbarkeit wahrnehmen und technische Hilfen in der Unterstützung
    von Menschen mit beeinträchtigter Mobilität fachgerecht nutzen
  - selbstfürsorglich mit sich selbst umgehen und Aktivitäten zur Gesundheitsförderung wahrnehmen Wissensgrundlagen
  - Metaparadigmen der Pflege anhand einer ausgewählten Pflegetheorie
  - sensomotorische Entwicklung im Kindesalter (Vertiefung in CE 10) und physiologische Veränderungen
    der Motorik im Alter (Vertiefung in CE 09) mit entsprechenden Beeinträchtigungen
  - Anatomie, Physiologie, Pathologie des Bewegungsapparats, u. a. Osteoporose, Arthrose, rheumatoide
    Arthritis, Frakturen der Wirbelsäule, Bandscheibenprolaps, Hüftdysplasie
  - Expertenstandards, u. a. Sturzprophylaxe in der Pflege, Erhaltung und Förderung der Mobilität, Dekubitusprophylaxe
    in der Pflege (vgl. CE 02 B)
  - Kontrakturprophylaxe
  - Thromboseprophylaxe (Vertiefung in CE 05)
  - rückengerechtes Arbeiten 49 Unterstützung bei der selbstbestimmten Lebensführung und Selbstpflege
    CE 02 A Mobilität interaktiv, gesundheitsfördernd und präventiv gestalten
  - Vertiefung Pflegeprozess, u. a. Strukturmodell (vgl. CE 01)
  - analoge und digitale Dokumentation
  - aktivierende Pflege 50 Unterstützung bei der selbstbestimmten Lebensführung und Selbstpflege CE 02
    B Menschen in der Selbstversorgung unterstützen CE 02 B Menschen in der Selbstversorgung unterstützen
    Inhalte/Situationsmerkmale
  - Selbstversorgungsdefizite, Ressourcen und Fähigkeiten der zu pflegenden Menschen mithilfe erster pflegerischer
    Modelle und Theorien beobachten und beschreiben
  - individuelle Bedürfnisse wahrnehmen und in der Unterstützung bei der Selbstversorgung berücksichtigen
  - Veränderungen des Gesundheitszustands (inkl. der Vitalwerte) anhand von grundlegendem Wissen aus der
    Pflege und den Bezugswissenschaften beobachten, beschreiben und sachgerecht dokumentieren
  - Pflegebedürftigkeit beschreiben und einordnen (Vertiefung in CE 09)
  - prophylaktische Maßnahmen bei gesundheits- und entwicklungsbedingten Einschränkungen der Mobilität
    in die 51 Unterstützung bei der selbstbestimmten Lebensführung und Selbstpflege CE 02 B Menschen in
    der Selbstversorgung unterstützen Körperpflege integrieren
  - pflegerische Unterstützung oder entwicklungsbedingte Übernahme bei der Selbstversorgung geben und
    dabei für die Patientensicherheit sorgen
  - hygienische Maßnahmen in der pflegerischen Unterstützung berücksichtigen
  - grundlegende Maßnahmen zur Gesundheitsförderung und Prävention in die pflegerische Unterstützung bei
    der Selbstversorgung integrieren
  - Kommunikation und Interaktion in körpernahen und intimen pflegerischen Handlungen einfühlsam gestalten
  - das eigene Handeln an ausgewählten Expertenstandards der Pflege orientieren – exemplarische vertiefte
    Auseinandersetzung mit ein bis zwei Standards, die sich auf die Unterstützung bei Einschränkungen
    in der Selbstversorgung beziehen
  - mit Pflegedokumentationssystemen (analog/digital) umgehen, diesen Informationen entnehmen und durchgeführte
    Pflege dokumentieren
  - digitale Messinstrumente und technische Hilfsmittel fachgerecht anwenden
  - Patienten bei der Hilfsmittelversorgung unterstützen, z. B. beim Hören, Sehen
  - beruflich bedingte Intimitätsverletzungen respekt- und würdevoll gestalten und sich selbst reflektieren
  - Struktur und Organisation des Einsatzbereichs kennenlernen und sich darin orientieren Wissensgrundlagen
  - Überblick über Anatomie, Physiologie der Haut
  - Wahrnehmen, Beobachten, Beurteilen, Handeln
  - Beobachten des nonverbalen Kommunikationsverhaltens, z. B. sieben Basisemotionen (P. Ekman)
  - professionelle Hautbeobachtung
  - häufige alters- und gesundheitsbedingte Veränderungen des Hautzustands aller Altersgruppen, u. a.
    parasitäre Hauterkrankungen, Psoriasis; allergische Reaktionen, Malignome, Dermatitiden (vgl. CE 10)
  - Grundlagen der Mikrobiologie und der Vermeidung von Infektionsübertragung
  - Infektionskrankheiten, u. a. HIV/AIDS, Tuberkulose, Meningitis, multiresistente Erreger, Influenza,
    Malaria, übertragbare Kinderkrankheiten (z. B. Masern, Röteln, Mumps, Scharlach, Windpocken), nosokomiale
    Infektionen 52 Unterstützung bei der selbstbestimmten Lebensführung und Selbstpflege CE 02 B Menschen
    in der Selbstversorgung unterstützen
  - Infektionsschutzgesetz (IFSG) und Robert Koch-Institut (RKI)
  - Erkrankungen des Mund- und Rachenraums
  - Überblick über Anatomie, Physiologie der Verdauungsorgane (Vertiefung in CE 05)
  - Überblick über Anatomie, Physiologie der ableitenden Harnwege (Vertiefung in CE 05)
  - Hilfsmittel zur Unterstützung beim An- oder Auskleiden
  - Hautpflegeprodukte, u. a O/W- und W/O-Produkte
  - Berührungsqualität, belebende und beruhigende Waschung (Basale Stimulation, Vertiefung in CE 08)
  - Entwicklung des Schamgefühls
  - 'Einführung in die Ethik: Umgang mit Würde und Respekt'
  - grundlegende Einführung in die Prinzipien pflegerischen Hygienehandelns
  - professionelle Nähe-Distanz-Regelung in Pflegesituationen
  - Intertrigoprophylaxe
  - Mundpflege, u. a. spezielle Mundpflege
  - Zahnprothesenpflege
  - Soor- und Parotitisprophylaxe
  - enterale und parenterale Ernährung
  - Grundlagen der Ernährung bei Menschen aller Altersstufen
  - verschiedene Ess- und Trinkhilfen
  - Expertenstandards, u. a. „Ernährungsmanagement zur Sicherung und Förderung der ora
- ce: CE 03
  titel: Erste Pflegeerfahrungen reflektieren – verständigungsorientiert kommunizieren
  handlungsanlaesse:
  - erste Pflegeerfahrungen im Orientierungseinsatz, erlebte Anforderungen, Irritationen, Widersprüche
    und die Komplexität pflegerischen Handelns
  - erlebte Begegnungen mit Ekel, Selbstekel, Scham
  - divergierende Interessen in der pflegerischen Kommunikation
  - empfundene Sprachlosigkeit
  - Kommunikations- und Informationsbedürfnisse zu pflegender Menschen und ihrer Bezugspersonen 32 Gestaltung
    von Arbeits- und Beziehungsprozessen CE 03 Erste Pflegeerfahrungen reflektieren – verständigungsorientiert
    kommunizieren
  kontextbedingungen:
  - Bedingungen bzw. Spannungsfelder im pflegerischen Handeln
  - Asymmetrie pflegerischen Handelns
  handlungsmuster:
  - erste Pflegeerfahrungen reflektieren, inkl. erlebter Begegnungen, z. B. mit Ekel, Selbstekel, Scham
    (vgl. erlebte Phänomene und CE 2 B)
  - Emotionen regulieren
  - mit belastenden, fordernden Erfahrungen umgehen, kollegiale Beratung in Anspruch nehmen
  - Grundsätze der verständigungs- und beteiligungsorientierten Gesprächsführung und unterschiedliche
    Kommunikationskanäle nutzen, Kommunikationsbarrieren abbauen
  - Aushandlungsprozesse zwischen Pflegeanforderungen und individuellen Bedürfnissen von Betroffenen gestalten
    (nicht nur sprachlich, sondern auch nonverbal und taktil) Wissensgrundlagen
  - Einführung in die Emotionspsychologie
  - Geltungsansprüche in Aushandlungsprozessen; (pflege)-berufswissenschaftliche Studien zu Phänomenen
    von Macht und Machtmissbrauch in pflegerischen Interaktionen
  - Gewalt in der Pflege, u. a. körperliche und psychische Gewalt, Risiken, Auslöser, Gewaltvermeidung
  - Vertiefung des Pflegeprozesses – Bedürfnisse und Probleme erkennen
  - Pflegeanamnese und Erstgespräch
  - nonverbale, paralinguistische und leibliche Interaktionsformen, Kommunikationsmodelle (Vertiefung
    von CE 01 und CE 02 B), u. a. Das Vier-SeitenModell (F. Schulz von Thun), Personenzentrierte Gesprächsführung
    (C. R. Rogers), Themenzentrierte Interaktion (R. Cohn)
  - Sinneseinschränkungen, u. a. Presbyakusis, Glaukom, Katarakt, Amaurose
  - Gesundheitsförderung und Prävention als Grundbegriffe pflegerischen Handelns (auch Definition WHO)
    (vgl. CE 04) 33 Gestaltung von Arbeits- und Beziehungsprozessen
- ce: CE 04
  titel: Gesundheit fördern und präventiv handeln
  handlungsanlaesse:
  - eigene Gesundheit erhalten bzw. verbessern wollen bzw. Bereitschaft zu einer verbesserten Selbstfürsorge
  - mit subjektiven Gesundheitsvorstellungen konfrontiert sein bzw. subjektive Gesundheitsvorstellungen
    aufdecken
  - Bereitschaft zu gesundheitsförderlichen und präventiven Verhaltensweisen in verschiedenen Altersstufen,
    z. B. im Hinblick auf Vorsorgeuntersuchungen und Impfungen
  - vorhandene bzw. fehlende Gesundheitsressourcen
  - Informations- und Beratungsbedarfe von (zu pflegenden) Menschen aller 66 Gesundheit und Entwicklung
    fördern CE 04 Gesundheit fördern und präventiv handeln Altersstufen und ihren Bezugspersonen zu o.
    g. gesundheitsbezogenen Themen
  - Gefahr der Entwicklung eines metabolischen Syndroms
  - Gefahr einer Gesundheitsschädigung bzw. gefahrengeneigtes Gesundheitsverhalten in allen Altersstufen,
    z. B. Suchtverhalten, bewegungsarmer Lebensstil, (entwicklungsbedingtes) Risikoverhalten (z. B. auch
    von Klein- und Schulkindern im Straßenverkehr und im Haushalt, von Jugendlichen im Umgang mit Suchtstoffen
    und -formen oder Gefahr einer beeinträchtigten Risikoeinschätzung)
  - Risiko der Verschlechterung der gesundheitlichen Lage bzw. Komplikationsrisiko
  - (fehlende) soziale Unterstützung im gesundheitsförderlichen Verhalten
  - beeinträchtigte individuelle und familiäre Resilienz bzw. Bereitschaft zu einer verbesserten Resilienz
  - beeinträchtigte Familienprozesse und fehlende individuelle und familiäre Schutz- und Risikofaktoren
    für das Kindeswohl
  - Bereitschaft zu einer verbesserten elterlichen Fürsorge bzw. Gefahr einer beeinträchtigten elterlichen
    Fürsorge
  - Bindung bzw. Gefahr einer beeinträchtigten Bindung
  - Vernachlässigung, fehlende Verlässlichkeit der Bezugspersonen
  - sich gestresst fühlen, sich ausgebrannt fühlen (Burn-out, Cool-out)
  - Mobbing und Hate Speech
  - gesundheitsförderliche Bedingungen am Arbeits- und Lernplatz gestalten wollen
  - Informations-, Anleitungs- und Beratungsbedarfe von Auszubildenden und Teammitgliedern zu pflegefachlichen
    Fragestellungen
  - institutionelle gesundheitsbezogene Bedingungen, u. a. gesundheitsgefährdende Arbeitsbedingungen und
    physische und psychische Belastungen am Arbeits- und Lernplatz
  - Verantwortung für Patientensicherheit 3. Ausbildungsdrittel
  - Informations- und Beratungsbedarfe von Menschen aller Altersstufen und Einrichtungen zu gesundheitsbezogenen
    Fragen
  - gesundheitsbezogene (ethische) Entscheidungskonflikte
  - Belastungssituationen in der intraprofessionellen Zusammenarbeit bzw. drohende Konflikte im Pflegeteam
  - Unterstützungsbedarfe in Familien und Familiengesundheit
  - drohende (auch sexuelle) Gewalt 67 Gesundheit und Entwicklung fördern CE 04 Gesundheit fördern und
    präventiv handeln
  - Gefahr von Kindesmissbrauch bzw. Gefahr des beeinträchtigten Kindeswohls
  kontextbedingungen:
  - alle gesundheitsbezogenen Einrichtungen und pflegerischen Handlungsfelder
  - weitere Einrichtungen (z. B. Betriebe, Schulen, Kindertagestätten, Familienzentren, Kinderschutzzentren,
    Sozialpädiatrische Zentren, Frühförderung, Jugendämter, Polizei), die gesundheitsbezogene Angebote
    unterbreiten
  - gesundheitsbezogene Werte und Normen in der Gesellschaft und in Institutionen 3. Ausbildungsdrittel
    – erweiternd
  - rechtliche Rahmenbedingungen zu Gesundheitsförderung und Prävention
  - Schnittstellen zwischen Gesundheitsberufen, anderen beratenden Berufen und in der Prävention tätigen
    Organisationen und Netzwerken
  handlungsmuster:
  - Reflexion des eigenen konkreten Gesundheitsverhaltens anhand von Gesundheitsverhaltensmodellen und
    Ableitung konkreter Konsequenzen für das eigene gesundheitsbezogene Verhalten und für das pflegerische
    Handeln
  - Reflexion und Mitgestaltung der Arbeitsplatz- und Lernbedingungen, gesundheitsförderliches Verhalten
    in der Lerngruppe befördern
  - Maßnahmen zum Arbeitsschutz
  - bewusste Arbeitszeit- und Freizeitgestaltung bzw. Selbstsorge
  - individuelles Gesundheitscoaching
  - Methoden zum Schutz vor physischen und psychischen Belastungen, Stressbewältigung und -reduktion und
    Resilienzentwicklung, z. B. Entspannungsübungen, Supervision, Mediation Fokus auf andere Akteure
  - Erhebung von Resilienz- oder/und Risikofaktoren anhand von Instrumenten und Screening
  - gesundheitsförderliche und präventive Handlungsmöglichkeiten im pflegerischen Handeln identifizieren
  - 'Gesundheitskommunikation: Information und Schulung verschiedener Zielgruppen zu gesundheitsbezogenen
    Fragen unter Einbezug biografischer, sozialisatorischer und entwicklungsbedingter 68 Gesundheit und
    Entwicklung fördern CE 04 Gesundheit fördern und präventiv handeln Voraussetzungen'
  - Kompetenzen, Gewohnheiten, Lebensstile und soziale Unterstützungsmöglichkeiten
  - gesundheitsförderliche Angebote für verschiedene Zielgruppen gestalten (z. B. in Kindertagesstätten,
    Schulen, Einrichtungen des betreuten Wohnens, in Betrieben)
  - Information, Schulung und Beratung von zu pflegenden Menschen mit metabolischem Syndrom und ihren
    Bezugspersonen (Sekundärprävention)
  - Maßnahmen der Suchtprävention
  - technische bzw. digitale Hilfsmittel für gesundheitsförderliche und präventive Informations- und Beratungsangebote
    nutzen (z. B. Gesundheits-Apps, Telecare) und kritische fachliche Reflexion der Angebote
  - gesundheitsbezogene Angebote in Pflegeschule und Praxiseinrichtung mitgestalten bzw. nutzen
  - Maßnahmen zur Patientensicherheit
  - Information, Anleitung und Beratung von Auszubildenden, Praktikant*innen sowie freiwillig Engagierten
    3. Ausbildungsdrittel
  - 'spezielle Gesundheitskommunikation: Beratung verschiedener Zielgruppen zu gesundheitsbezogenen Fragen'
  - Gestaltung von Pflegesituationen, in denen aktuelle Bedürfnisse zu pflegender Menschen langfristigen
    Bedarfen, wie Wohlbefinden oder Lebensqualität oder Lebensdauer, entgegenstehen
  - gesundheitsbezogene Entscheidungsfindung bzw. informierte Entscheidung, ethische Aspekte
