meta:
  id: kompetenzen
  title: Kompetenztaxonomie fuer die generalistische Pflegeausbildung
  purpose: Competency catalogue for Family B. KOMP-06 tests set membership against `anlage_2_authoritative`,
    never against the Lehrplan-derived list.
  sources:
  - role: authoritative competency catalogue
    document: Anlage 2 PflAPrV (zu § 9 Absatz 1 Satz 2)
    url: https://www.gesetze-im-internet.de/pflaprv/anlage_2.html
    authority: binding_federal
  - role: 'curricular structure: CE, Zeitrichtwerte, CE-to-competency mapping'
    document: Lehrplaene und Ausbildungsplaene fuer die Berufsfachschule fuer Pflege (StMUK / ISB Bayern,
      Juli 2020)
    authority: official_state
  generated_by: scripts/extract_lehrplan.py
  scope_note: Generalistische Ausbildung only. The Anlage 3 (Kinderkrankenpflege) and Anlage 4 (Altenpflege)
    curricula in the same document are excluded.
  counts:
    curriculare_einheiten: 11
    zeitrichtwert_gesamt_stunden: 1260
    einheiten_im_dritten_drittel: 8
    anlage_2_authoritative: 85
    anlage_1_authoritative: 79
  cross_check:
    anlage_1:
      lehrplan_derived_count: 76
      pflaprv_authoritative_count: 79
      in_both: 76
      cited_by_lehrplan_but_absent_from_pflaprv: []
      in_pflaprv_but_never_cited_by_lehrplan:
      - I.1.g
      - I.1.i
      - I.2.d
    anlage_2:
      lehrplan_derived_count: 79
      pflaprv_authoritative_count: 85
      in_both: 79
      cited_by_lehrplan_but_absent_from_pflaprv: []
      in_pflaprv_but_never_cited_by_lehrplan:
      - I.1.a
      - I.1.f
      - I.1.h
      - I.1.i
      - I.2.d
      - I.2.f
  komp_06_finding: 'Every code the Lehrplan cites under an Anlage-2 heading does exist in PflAPrV''s Anlage
    2, so the Lehrplan invents nothing -- but it is a strict subset. 6 Anlage-2 competencies are never
    cited by the Lehrplan at the Anlage-2 level: I.1.a, I.1.f, I.1.h, I.1.i, I.2.d, I.2.f. KOMP-06 built
    on the Lehrplan-derived list would therefore have raised a false flag against an item legitimately
    claiming any of them -- including I.1.h, the code tech doc 3.3.1 uses as its worked example. This
    is why KOMP-06 reads `anlage_2_authoritative`, and it resolves the verification item in tech doc 12.'
